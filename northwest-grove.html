<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 서북부 · 지도와 숲</title><style>body{margin:0;background:#13202b;color:#edf3f7;font:15px system-ui}header{padding:16px 22px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0;color:#c2cfda;line-height:1.5}label,button,a{display:inline-block;margin:6px 10px 6px 0}button,select{padding:7px}a{color:#8edfff}#view{height:74vh;min-height:400px;position:relative}canvas{display:block;width:100%;height:100%}.warn{color:#ffd788}</style></head><body><header><h1>서울 서북부 · 위성 사진 + 수치지도 + 나무·숲</h1><p>2024-06-06 촬영 · ②번 영상의 약 1 km 시험 구역 · 드래그로 회전, 휠로 확대</p><p class="warn">지도 배치는 카탈로그 경계에 따른 잠정 정합입니다. 나무 위치·높이는 수관 영역 안의 시각화용 추정이며, 지형은 등고선·표고점에서 보간한 지표면입니다. 옹벽·단차는 단순화됩니다.</p><label><input id="terrain" type="checkbox" checked>지형 높이</label><a href="?site=xi">경희궁자이</a><a href="?site=northwest">월드컵공원</a><a href="?site=yangjae">양재천</a><a href="?site=han">한강</a><label id="waterControl"><input id="water" type="checkbox" checked>물 후보</label><span id="waterInfo"></span><label><input id="trees" type="checkbox" checked>나무·숲</label><label style="color:#eccc2d"><input id="low" type="checkbox" checked>낮은 식생 후보</label><label>낮은 식생 표현 <select id="lowMode"><option value="3d">3D · 높이 0.4m 가정</option><option value="mask">후보 영역 표시</option></select></label><label>후보 기준 <select id="lowThreshold"><option value="035">0.35</option><option value="050">0.50</option></select></label><label><input id="maps" type="checkbox" checked>수치지도 건물 외곽</label><label><input id="photo" type="checkbox" checked>위성 사진</label><label>나무 높이 <select id="height"><option value=".5">약 4m</option><option value="1" selected>약 8m</option><option value="1.5">약 12m</option></select></label><button id="top">수직으로 비교</button><button id="oblique">숲 입체 보기</button><p id="lowStatus" class="warn"></p><span id="status">불러오는 중…</span><p><a href="/verification/northwest-grove/registration.jpg" target="_blank">사진·건물 외곽 겹침 이미지</a><a href="/verification/northwest-grove/scene.json" target="_blank">좌표·출처·가정</a><a href="/verification/northwest-grove/road-filtered-review.jpg" target="_blank">도로 제외 결과(파랑=도로)</a></p></header><div id="view"></div><script type="module" src="/src/northwest-grove-review.js"></script></body></html>

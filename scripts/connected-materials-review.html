<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>다운로드 자료 연결 검토</title>
<style>body{font:15px system-ui;color:#193247;background:#f4f7fa;margin:28px}h1{font-size:26px}p{line-height:1.6;max-width:1200px}input,select,button{padding:10px;margin:5px;border:1px solid #afbdca;border-radius:5px}button,a{cursor:pointer}a{color:#06619c}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #dee5eb}small{display:block;color:#576c7b;max-width:600px;overflow-wrap:anywhere}section{background:white;padding:20px;border-radius:8px;margin-top:20px}.badge{display:inline-block;background:#e4eff7;padding:5px;margin:4px;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:180px;max-height:120px}#detail{display:none}.cols{display:flex;gap:18px;flex-wrap:wrap}.cols>div{flex:1;min-width:300px}.muted{color:#627484}</style>
<h1>다운로드 자료 연결 검토</h1>
<p>단지 원본·공고·첨부파일을 출처와 함께 연결한 목록입니다. <b>공고는 단지가 아니며, 문서의 단지명 언급은 확정 연결이 아닙니다.</b> 원본에 있는 타입 표기를 보존하고 다른 기관의 타입과 임의로 합치지 않았습니다. 파일명·본문에서 찾은 평면도/배치도 표시는 내용 검토 후보입니다.</p>
<div id="summary">불러오는 중…</div>
<p id="recovery" class="muted"></p>
<p><a href="entities.csv">단지·공고 CSV</a> · <a href="links.csv">연결 근거 전체 CSV</a> · <a href="material-matrix.csv">자료 종류별 보유 대조표</a> · <a href="attachments.csv">전체 첨부 연결</a> · <a href="type-assets.csv">타입별 원본</a> · <a href="file-review.csv">추가 검토 파일</a> · <a href="summary.json">집계</a></p>
<select id="mode"><option value="entities">단지·공고</option><option value="files">전체 저장 파일</option></select>
<input id="q" placeholder="단지명·주소 / 파일명·타입 검색" size="38">
<select id="source"><option value="">전체 출처</option><option value="kb">KB 기존 자료</option><option value="sh">SH</option><option value="lh">LH 공고</option><option value="builder">건설사</option><option value="official">공식 건물·세대 기록</option></select>
<button id="search">검색</button><span id="count"></span>
<table><thead id="head"></thead><tbody id="rows"></tbody></table>
<button id="prev">이전</button><span id="page"></span><button id="next">다음</button>
<section id="detail"></section>
<script>
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const original=(file,label='원본',locator='')=>'<a target="_blank" rel="noopener" href="/original?file='+encodeURIComponent(file)+(locator.startsWith('page:')?'#page='+locator.slice(5):'')+'">'+esc(label)+'</a>';
let offset=0,total=0,detailId='',attachmentOffset=0;
async function api(path){const r=await fetch(path);const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data;}
async function render(){const mode=$('mode').value;const data=await api('/api/'+(mode==='files'?'files':'search')+'?q='+encodeURIComponent($('q').value)+'&source='+encodeURIComponent($('source').value)+'&offset='+offset);total=data.total;$('count').textContent=total.toLocaleString()+'개';$('page').textContent=Math.floor(offset/50)+1+' / '+Math.max(1,Math.ceil(total/50));$('prev').disabled=offset===0;$('next').disabled=offset+50>=total;
if(mode==='files'){$('head').innerHTML='<tr><th>파일</th><th>검사 상태</th><th>크기</th></tr>';$('rows').innerHTML=data.rows.map(r=>'<tr><td>'+original(r.path,r.path)+'</td><td>'+esc(r.status)+'<small>'+esc(r.detail)+'</small></td><td>'+Number(r.bytes).toLocaleString()+'</td></tr>').join('');}
else{$('head').innerHTML='<tr><th>단지·공고</th><th>출처</th><th>원본 첨부</th><th>연결 후보 출처</th></tr>';$('rows').innerHTML=data.rows.map(r=>'<tr><td><button data-id="'+esc(r.id)+'">'+esc(r.name)+'</button><small>'+esc(r.address)+'</small></td><td>'+esc(r.source)+'</td><td>'+r.assets+'</td><td>'+r.relatedSources+'</td></tr>').join('');}}
async function detail(id,off=0){detailId=id;attachmentOffset=off;const d=await api('/api/detail?id='+encodeURIComponent(id)+'&offset='+off);$('detail').style.display='block';$('detail').innerHTML='<h2>'+esc(d.name)+'</h2><p>'+esc(d.id+' / '+d.address)+' · '+original(d.manifest,'출처 기록')+'</p><div class="cols"><div><h3>타입·동호수 원본 정보</h3><pre>'+esc(JSON.stringify(d.metadata,null,2))+'</pre></div><div><h3>주변 데이터 연결</h3><p class="muted">지도 경계상자·영상 카탈로그 범위 기준입니다. 건물 높이와 실제 유효화소 완비를 뜻하지 않습니다.</p><pre>'+esc(d.environment?JSON.stringify(d.environment,null,2):'좌표·공간 연결 미확인')+'</pre></div></div><h3>직접 첨부 '+d.attachmentTotal+'개</h3><p>현재 '+(off+1)+'~'+Math.min(off+100,d.attachmentTotal)+' 표시</p><table><tr><th>자료·타입</th><th>파일 검사</th><th>열기</th></tr>'+d.attachments.map(a=>'<tr><td>'+esc(a.label)+'<small>'+esc(a.type+' / '+a.kind)+'</small></td><td>'+esc(a.status)+'</td><td>'+original(a.file)+'</td></tr>').join('')+'</table><button id="aprev" '+(off===0?'disabled':'')+'>첨부 이전</button><button id="anext" '+(off+100>=d.attachmentTotal?'disabled':'')+'>첨부 다음</button><h3>출처 간 연결 근거 '+d.linkTotal+'개 (최대 200개 표시)</h3><table>'+d.links.map(l=>'<tr><td><button data-id="'+esc(l.target===id?l.source:l.target)+'">'+esc(l.name||l.source)+'</button></td><td>'+esc(l.method)+' / '+esc(l.status)+'<small>'+esc(l.evidence)+'</small></td><td>'+esc(l.locator)+(l.file?' '+original(l.file,'근거 원본',l.locator):'')+'</td></tr>').join('')+'</table><h3>자료 종류 근거 '+d.evidenceTotal+'개 (최대 200개 표시)</h3><p>키워드의 존재를 보여줍니다. 실제 도면 수록·단지 전체 적용 여부를 검토해야 합니다.</p><table>'+d.evidence.map(e=>'<tr><td>'+esc(e.role)+'<small>'+esc(e.basis)+'</small></td><td>'+esc(e.snippet)+'</td><td>'+original(e.file,e.locator,e.locator)+'</td></tr>').join('')+'</table>';renderHouseholds(d.officialHouseholds,id);$('aprev').onclick=()=>detail(id,off-100).catch(showError);$('anext').onclick=()=>detail(id,off+100).catch(showError);$('detail').scrollIntoView({behavior:'smooth'});}
function showError(e){$('count').textContent='오류: '+e.message;}
function renderHouseholds(d,id){if(!d?.total)return;const block=document.createElement('div');block.innerHTML='<h3>공식 동호수 원본: '+d.total.toLocaleString()+'행</h3><p>'+esc(d.note)+'</p><p>'+original(d.source,'전국 공시가격 원본')+' · <a target="_blank" href="/api/households?id='+encodeURIComponent(id)+'">동호수 목록 JSON</a></p><table><tr><th>원본 단지명</th><th>동</th><th>호</th><th>전용면적</th><th>연결 근거</th></tr>'+d.rows.slice(0,20).map(r=>'<tr><td>'+esc(r.complex_name)+'</td><td>'+esc(r.building)+'</td><td>'+esc(r.unit)+'</td><td>'+esc(r.exclusive_area)+'</td><td>'+esc(r.method)+'</td></tr>').join('')+'</table><p>화면에는 처음 20행을 표시합니다. JSON 목록은 offset으로 다음 100행을 조회할 수 있습니다.</p>';$('detail').append(block);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id).catch(showError)});
$('search').onclick=()=>{offset=0;render().catch(showError)};$('q').onkeydown=e=>{if(e.key==='Enter')$('search').click()};$('mode').onchange=$('source').onchange=()=>{offset=0;render().catch(showError)};$('prev').onclick=()=>{offset-=50;render().catch(showError)};$('next').onclick=()=>{offset+=50;render().catch(showError)};
api('/api/summary').then(s=>{$('summary').innerHTML=Object.entries(s.entitiesBySource).map(([k,v])=>'<span class="badge">'+esc(k)+' '+v.toLocaleString()+'건</span>').join('')+'<span class="badge">파일 '+s.files.toLocaleString()+'개</span><span class="badge">공공자료 연결 후보가 있는 KB 단지 '+s.kbWithPublicCandidates+'개</span><p class="muted">최초 검사 완료 '+esc(s.finishedAt)+' · 스캔 문서 OCR은 아래 진행 상태를 확인하세요. OCR 근거는 검토 후보이며, CAD 내부 해석은 미실시입니다.</p>';}).catch(showError);render().catch(showError);
async function recovery(){try{const r=await api('/api/recovery');const stale=Date.now()-Date.parse(r.updatedAt)>180000;$('recovery').textContent='문서 추가 해석: '+r.stage+(stale?' (갱신 지연 — 실행 상태 확인 필요)':'')+' · 완료 '+(r.jobs?.complete||0)+'개 · 검토 필요 '+(r.jobs?.['review-required']||0)+'개 · 오류 '+(r.jobs?.error||0)+'개 · 저장 텍스트 '+(r.cachedPages||0)+'건 · 마지막 갱신 '+(r.updatedAt||'없음');}catch(e){$('recovery').textContent='추가 해석 상태를 불러오지 못했습니다.'}}
recovery();setInterval(recovery,30000);
</script></html>
